name: youtube_short
title: YouTube Short
description: One idea, one script, finished vertical Short(s) in your target language(s) (en, fr, ar), stopping for your approval at each checkpoint. Never uploads without explicit approval.
params:
  languages: [en]       # overridden by channel.yaml or `-p languages=en,fr` / `-p languages=en`
  style: faceless, fast cuts, bold captions, calm narration
  topic: null           # optional: steer the research to a topic inside the niche
  budget_usd: null      # set a number (e.g. 2.50) to cap LLM cost
settings:
  max_retries: 2
  max_revision_rounds: 2
  retry_backoff_s: 1.0
steps:
  - id: research
    title: Find 3 video ideas
    agent: trend_researcher
    checkpoint: {id: A, title: Pick the video idea, type: choice}
  - id: script
    title: Write the script
    agent: scriptwriter
    depends_on: [research]
    checkpoint: {id: B, title: Approve the script}
  - id: visuals
    title: Source scene visuals
    agent: visual_producer
    depends_on: [script]
  - id: audio
    title: Voiceover, music and SFX
    agent: voice_audio
    depends_on: [script]
  - id: packaging
    title: Title, description, thumbnail
    agent: packaging
    depends_on: [script, visuals]
  - id: edit
    title: Edit the final videos
    agent: editor
    depends_on: [visuals, audio]
  - id: qa
    title: Quality check
    agent: qa_reviewer
    depends_on: [edit, packaging]
    checkpoint: {id: C, title: Approve the final videos (never uploaded without your OK), route_to: edit}
