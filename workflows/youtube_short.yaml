name: youtube_short
title: YouTube Short (Egyptian Arabic + French)
description: One idea, one script, two finished Shorts (Egyptian Arabic and French), stopping for your approval at each checkpoint. Never uploads.
params:
  languages: [ar, fr]
  style: faceless, fast cuts, bold captions, calm narration
  topic: null           # optional: steer the research to a topic inside the niche
  budget_usd: null      # Claude runs on your plan; set a number to cap the notional cost
settings:
  max_retries: 2
  max_revision_rounds: 2
steps:
  - id: research
    title: Find 3 video ideas
    agent: trend_researcher
    checkpoint: {id: A, title: Pick the video idea, type: choice}
  - id: script
    title: Write the script
    agent: scriptwriter
    depends_on: [research]
    checkpoint: {id: B, title: Approve the script}
  - id: visuals
    title: Source scene visuals
    agent: visual_producer
    depends_on: [script]
  - id: audio
    title: Voiceover, music and SFX
    agent: voice_audio
    depends_on: [script]
  - id: packaging
    title: Title, description, thumbnail
    agent: packaging
    depends_on: [script, visuals]
  - id: edit
    title: Edit the final videos
    agent: editor
    depends_on: [visuals, audio]
  - id: qa
    title: Quality check
    agent: qa_reviewer
    depends_on: [edit, packaging]
    checkpoint: {id: C, title: Approve the final videos (you upload them yourself), route_to: edit}
