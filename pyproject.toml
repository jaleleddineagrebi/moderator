[project]
name = "moderator"
version = "0.1.0"
description = "Reusable multi-agent workflow engine with a live dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "edge-tts>=7.0",
    "pillow>=10.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
]

[project.scripts]
moderator = "moderator.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moderator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
