<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderator Dashboard</title>
  <link rel="stylesheet" href="static/styles.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <h1 id="wf-title">Loading…</h1>
      <span id="run-id" class="muted mono"></span>
      <span id="archive-badge" class="badge s-queued" hidden>archived view</span>
      <span id="pages-badge" class="badge s-running" hidden>GitHub Pages</span>
    </div>
    <div class="top-actions">
      <a id="gh-actions-btn" class="btn primary link-btn" target="_blank" rel="noopener" hidden>＋ Run Workflow</a>
      <button id="retry-all-btn" class="btn danger-btn" hidden>Retry failed</button>
      <select id="run-select" class="run-select" title="Switch run" aria-label="Switch workflow run" hidden></select>
      <span id="run-status" class="badge"></span>
      <button id="theme-toggle" class="icon-btn" title="Toggle light/dark" aria-label="Toggle light or dark theme">◐</button>
    </div>
  </header>

  <main>
    <section id="pages-banner" class="card pages-banner" hidden></section>

    <section class="overview card">
      <div class="progress-block">
        <div class="row-between"><span class="label">Overall progress</span><span id="ov-pct" class="mono">0%</span></div>
        <div class="bar"><div id="ov-bar" class="bar-fill"></div></div>
      </div>
      <div class="stat"><span class="label">Elapsed</span><span id="ov-elapsed" class="stat-value mono">0:00</span></div>
      <div class="stat"><span class="label">Steps done</span><span id="ov-steps" class="stat-value mono">0/0</span></div>
      <div class="stat" title="Estimated Gemini Flash + Nano Banana API cost for this run.">
        <span class="label">Cost</span><span id="ov-cost" class="stat-value mono">$0.00</span>
      </div>
      <div id="ov-params" class="param-strip" hidden></div>
    </section>

    <section id="approvals" class="approvals" hidden></section>

    <section class="card">
      <h2>Checkpoints</h2>
      <ul id="checkpoints" class="notifications"></ul>
    </section>

    <section class="card">
      <div class="section-head"><h2>Pipeline</h2>
        <div class="legend">
          <span><i class="dot s-done"></i>done</span><span><i class="dot s-running"></i>running</span>
          <span><i class="dot s-waiting_for_approval"></i>needs you</span><span><i class="dot s-needs_revision"></i>revising</span>
          <span><i class="dot s-failed"></i>failed</span><span><i class="dot s-blocked"></i>blocked</span>
        </div>
      </div>
      <div class="pipeline-wrap"><svg id="pipeline" role="img" aria-label="Pipeline diagram"></svg></div>
    </section>

    <section>
      <h2 class="section-title">Agents</h2>
      <div id="cards" class="cards"></div>
    </section>

    <section class="card">
      <h2>Notifications</h2>
      <ul id="notifications" class="notifications"></ul>
    </section>
  </main>

  <dialog id="drawer" class="drawer">
    <div class="drawer-head">
      <div><h2 id="d-title"></h2><p id="d-role" class="muted"></p></div>
      <button class="icon-btn" id="d-close" aria-label="Close">✕</button>
    </div>
    <div id="d-body" class="drawer-body"></div>
  </dialog>

  <div id="conn" class="conn" hidden>Lost connection to the engine. Retrying…</div>
  <script src="static/app.js"></script>
</body>
</html>
