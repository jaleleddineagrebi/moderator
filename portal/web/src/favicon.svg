<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Hemisphere (Biological / Psychology) -->
  <path d="M30 14
           C23 14, 17 18.5, 16.5 25
           C13.5 26.5, 12 30, 13 34
           C12 37.5, 14.5 42, 18.5 43.5
           C19.5 47.5, 24 50, 28.5 49.5
           L30 49.5 Z"
        fill="none" stroke="url(#brainGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Cortical Folds -->
  <path d="M21 24 C24 24, 26 26, 26 29 M18 33 C22 33, 24 35, 25 38 M23 42 C25.5 41, 27.5 42, 29 44"
        fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Right Hemisphere (AI Neural Circuit) -->
  <path d="M34 14
           C41 14, 47 18.5, 47.5 25
           C50.5 26.5, 52 30, 51 34
           C52 37.5, 49.5 42, 45.5 43.5
           C44.5 47.5, 40 50, 35.5 49.5
           L34 49.5 Z"
        fill="none" stroke="url(#brainGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neural Circuit Lines & Synaptic Nodes on Right -->
  <path d="M34 22 L41 22 L44 26 M34 32 L43 32 M34 41 L40 41 L43 37"
        fill="none" stroke="#c084fc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="26" r="2.3" fill="#38bdf8"/>
  <circle cx="44" cy="32" r="2.3" fill="#a855f7"/>
  <circle cx="43" cy="37" r="2.3" fill="#38bdf8"/>

  <!-- Center Corpus Callosum Bridge -->
  <line x1="32" y1="13" x2="32" y2="51" stroke="url(#sparkGrad)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 3"/>
</svg>
