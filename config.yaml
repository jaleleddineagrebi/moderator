# Powered by Google Gemini.
# Text model routing: each agent declares `complexity: low|medium|high` in agents/<name>/agent.yaml and the
# moderator picks the tier below; every retry of a step moves one tier up. Models: "flash-lite", "flash", "pro"
# (fallback chains in moderator/engine/llm.py). Thinking: minimal | low | medium | high (thinking tokens are
# billed as output, so this is the main cost lever). Set `model:` here to force one model for every task.
# `image_model`: Nano Banana for scene/thumbnail images ("banana", "banana-lite" or "banana-pro").
llm:
  provider: gemini   # gemini | claude. Per run: `--llm claude`, `-p llm=claude` or env MODERATOR_LLM=claude
  # Claude (headless Claude Code on your Claude plan, no API key). Same complexity routing as Gemini.
  # Effort: low | medium | high | xhigh | max. Images still use Gemini Nano Banana when GEMINI_API_KEY is set.
  claude:
    tiers:
      low:    {model: haiku, effort: low}
      medium: {model: sonnet, effort: medium}
      high:   {model: opus, effort: high}
    timeout_s: 900
  # Gemini tiers (the default provider). Each agent's complexity (agents/*/agent.yaml) picks its tier; a retry
  # moves one tier up. Override per run: -p models=high=pro,medium=flash,low=flash-lite  (or all=flash).
  tiers:
    low:    {model: flash-lite, thinking: minimal}   # packaging/SEO, JSON formatting
    medium: {model: flash, thinking: low}            # trend research, QA review
    high:   {model: pro, thinking: high}             # scriptwriting, niche strategy (falls back to flash without Pro quota)
  image_model: banana
  timeout_s: 600

server:
  host: 127.0.0.1
  port: 8765

# Set GEMINI_API_KEY (and optional free stock/YouTube keys) in .env (see .env.example).
