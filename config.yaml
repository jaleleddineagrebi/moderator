# Powered by Google Gemini.
# Text model routing: each agent declares `complexity: low|medium|high` in agents/<name>/agent.yaml and the
# moderator picks the tier below; every retry of a step moves one tier up. Models: "flash-lite", "flash", "pro"
# (fallback chains in moderator/engine/llm.py). Thinking: minimal | low | medium | high (thinking tokens are
# billed as output, so this is the main cost lever). Set `model:` here to force one model for every task.
# `image_model`: Nano Banana for scene/thumbnail images ("banana", "banana-lite" or "banana-pro").
llm:
  tiers:
    low:    {model: flash-lite, thinking: minimal}   # packaging/SEO, JSON formatting
    medium: {model: flash, thinking: low}            # trend research, QA review
    high:   {model: flash, thinking: high}           # scriptwriting, niche strategy
  image_model: banana
  timeout_s: 600

server:
  host: 127.0.0.1
  port: 8765

# Set GEMINI_API_KEY (and optional free stock/YouTube keys) in .env (see .env.example).
