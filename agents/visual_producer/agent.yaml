title: Visual Producer
role: Sources a vertical 1080x1920 clip for every scene from free stock libraries (or generates one) and records each asset's license.
inputs: [script.json]
outputs: [assets/scene_XX.mp4, assets/licenses.json, assets/contact_sheet.jpg]
tools: [Pexels API, Pixabay API, Pillow, ffmpeg]
strategies: [stock_video, stock_photo, generated]
timeout_s: 1800
