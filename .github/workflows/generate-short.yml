name: Generate Short

# Runs on schedule (twice daily) or manually via "Run workflow".
# Executes Research -> Script -> Visuals + Audio -> Packaging + Editor -> QA,
# with Gemini (default) or Claude as the text model (input `llm`, or repo variable MODERATOR_LLM),
# uploads the finished MP4s & thumbnails as an Action artifact, and opens a `short-review` issue.
# Nothing is published to YouTube until you approve Checkpoint C (comment `/approve` on the issue
# or trigger the `Upload Short` workflow).
on:
  schedule:
    - cron: "17 5 * * *"    # 05:17 UTC (off-peak minute to avoid GitHub's top-of-the-hour queue delay)
    - cron: "23 14 * * *"   # 14:23 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic inside your niche (leave empty for AI trend research)"
        required: false
        type: string
      languages:
        description: "Optional languages override, e.g. en or en,fr or en,fr,ar (default: channel.yaml)"
        required: false
        type: string
      visual_mode:
        description: "Scene visuals: stock = moving B-roll video only ($0), auto = stock video + AI art where no clip fits, ai = AI art first, generated = gradients"
        required: false
        default: "stock"
        type: choice
        options:
          - stock
          - auto
          - ai
          - generated
      llm:
        description: "Text model: gemini (GEMINI_API_KEY) or claude (Claude Code CLI with CLAUDE_CODE_OAUTH_TOKEN); default = repo variable MODERATOR_LLM, else gemini"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - gemini
          - claude
      budget_usd:
        description: "Safety spend cap only (Free Tier keys always pay $0.00)"
        required: false
        default: "1.00"
        type: string

permissions:
  contents: write   # save topic history to the topics-history branch and update GitHub Pages
  issues: write     # open the Checkpoint C review issue

concurrency:
  group: generate-short
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Choose text model and verify its secret
        id: llm
        env:
          INPUT_LLM: ${{ (inputs.llm != 'default' && inputs.llm) || vars.MODERATOR_LLM || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "$INPUT_LLM" in
            gemini)
              if [ -z "$GEMINI_API_KEY" ]; then
                echo "::error::Missing GEMINI_API_KEY repository secret. Add it in GitHub -> Settings -> Secrets and variables -> Actions."
                exit 1
              fi ;;
            claude)
              if [ -z "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ]; then
                echo "::error::Missing CLAUDE_CODE_OAUTH_TOKEN secret (run 'claude setup-token' locally) or ANTHROPIC_API_KEY."
                exit 1
              fi
              [ -n "$GEMINI_API_KEY" ] || echo "::notice::No GEMINI_API_KEY: visuals use stock footage only (Claude cannot generate images)." ;;
            *)
              echo "::error::Unknown llm '$INPUT_LLM' (use gemini or claude)"; exit 1 ;;
          esac
          echo "provider=$INPUT_LLM" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"

      - name: Install ffmpeg & libass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libass9

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Load topic history (so scheduled runs never repeat a topic)
        run: bash .github/scripts/topics-history.sh load

      - name: Install Claude Code CLI (pinned)
        if: steps.llm.outputs.provider == 'claude'
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.292 && claude --version

      - name: Generate Short(s) and pause at Checkpoint C (streaming progress to GitHub Pages)
        id: gen
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_LLM: ${{ steps.llm.outputs.provider }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_LANGS: ${{ inputs.languages || vars.MODERATOR_LANGUAGES }}
          INPUT_NICHE: ${{ vars.MODERATOR_NICHE }}
          INPUT_VISUAL_MODE: ${{ inputs.visual_mode || vars.MODERATOR_VISUAL_MODE || 'stock' }}
          INPUT_BUDGET: ${{ inputs.budget_usd || vars.MODERATOR_BUDGET_USD || '1.00' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          args=(-p 'auto_approve=[A, B]' --llm "$INPUT_LLM")
          if [ -n "$INPUT_TOPIC" ]; then args+=(-p "topic=$INPUT_TOPIC"); fi
          if [ -n "$INPUT_LANGS" ]; then args+=(-p "languages=$INPUT_LANGS"); fi
          if [ -n "$INPUT_NICHE" ]; then args+=(-p "niche=$INPUT_NICHE"); fi
          if [ -n "$INPUT_VISUAL_MODE" ] && [ "$INPUT_VISUAL_MODE" != "auto" ]; then
            args+=(-p "visual_mode=$INPUT_VISUAL_MODE")
          fi
          if [ -n "$INPUT_BUDGET" ]; then args+=(-p "budget_usd=$INPUT_BUDGET"); fi

          # Stream live state.json agent progress to GitHub Pages every 15s during execution
          (
            last_sig=""
            while true; do
              sig=$(sha256sum runs/*/state.json 2>/dev/null || true)
              if [ -n "$sig" ] && [ "$sig" != "$last_sig" ]; then
                last_sig="$sig"
                bash .github/scripts/push-gh-pages.sh --no-media --gh-run-url "$RUN_URL" || true
              fi
              sleep 15
            done
          ) &
          WATCHER_PID=$!
          trap "kill $WATCHER_PID 2>/dev/null || true" EXIT

          uv run python -m moderator run youtube_short --headless "${args[@]}"

      - name: Upload run artifact (MP4s, thumbnails, captions, QA report, state.json)
        if: always() && steps.gen.outputs.run_dir
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: short-${{ steps.gen.outputs.run_id }}
          path: |
            ${{ steps.gen.outputs.run_dir }}
            !${{ steps.gen.outputs.run_dir }}/assets/raw
          retention-days: 14

      - name: Save topic history (topics-history branch; main only accepts pull requests)
        if: always()
        run: bash .github/scripts/topics-history.sh save

      - name: Publish Step Summary, Review Issue & GitHub Pages Dashboard
        if: always() && steps.gen.outputs.run_dir
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DIR: ${{ steps.gen.outputs.run_dir }}
          RUN_ID: ${{ steps.gen.outputs.run_id }}
          OUTCOME: ${{ steps.gen.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PYTHONIOENCODING: utf-8
        run: |
          uv run python -m moderator summary "$RUN_DIR" > body.md
          if [ "$OUTCOME" = "waiting" ]; then
            label=short-review
            title="Review Short: $RUN_ID"
            {
              echo ""
              echo "---"
              echo "### Live Agent Dashboard & Video Preview"
              echo "- **GitHub Pages Dashboard:** $PAGES_URL"
              echo "- **Action Artifact:** \`short-$RUN_ID\` at $RUN_URL"
              echo ""
              echo "### Publish Commands (Checkpoint C Approval)"
              echo "- \`/approve\` — upload all generated languages as **private**"
              echo "- \`/approve unlisted\` — upload as **unlisted**"
              echo "- \`/approve public\` — upload as **public**"
              echo "- \`/approve public en\` (or \`fr\` / \`ar\`) — upload only specific language(s)"
              echo "- \`/reject\` — close without uploading"
              echo ""
              echo "### Edit Before Publishing"
              echo "- \`/edit text make the hook punchier\` — rewrite the script"
              echo "- \`/edit first image show a man running at sunrise\` (or \`/edit image 3 ...\`, \`/edit images 2,4 ...\`, \`/edit last image\`) — replace scene visuals"
              echo "- \`/edit title ...\` / \`/edit thumbnail ...\` — title, description, thumbnail"
              echo "- \`/edit voice slower\` / \`/edit music lower\` — voiceover, mix"
            } >> body.md
          else
            label=short-failed
            title="Short generation failed: $RUN_ID"
            printf '\n\nDashboard: %s\nLogs: %s\n' "$PAGES_URL" "$RUN_URL" >> body.md
          fi
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n<!-- run_id: %s -->\n<!-- gh_run_id: %s -->\n' "$RUN_ID" "${{ github.run_id }}" >> body.md
          gh label create "$label" --force >/dev/null
          ISSUE_URL=$(gh issue create --title "$title" --label "$label" --body-file body.md)
          echo "Review issue created: $ISSUE_URL"
          bash .github/scripts/push-gh-pages.sh --run-id "$RUN_ID" --issue-url "$ISSUE_URL" --gh-run-url "$RUN_URL" || true
