name: Generate Short

# Runs on schedule (8 times a day, every 3 hours) or manually via "Run workflow".
# Executes Research -> Script -> Visuals + Audio -> Packaging + Editor -> QA,
# with Gemini (default) or Claude as the text model (input `llm`, or repo variable MODERATOR_LLM),
# uploads the finished MP4s & thumbnails as an Action artifact, and opens a `short-review` issue.
# Publishing: by default the finished Short is uploaded to YouTube automatically (public) right after QA,
# with no manual approval. Set the repository variable MODERATOR_AUTO_UPLOAD to `review_first` to go back to
# approving each Short yourself (comment `/approve` on the `short-review` issue), or to `private` / `unlisted`.
# If the automatic upload fails (e.g. YouTube daily quota), the run falls back to a `short-review` issue.
on:
  schedule:
    # 8 viral Shorts per day, one every 3 hours (rotates across the viral pillars automatically; 9:16 Shorts feed)
    - cron: "17 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "Video format: short (9:16 vertical Short) or long (16:9 3-4 min Deep-Dive)"
        required: false
        default: "short"
        type: choice
        options:
          - short
          - long
      pillar:
        description: "Optional viral pillar override (auto = rotate across mind_hacks, ai_future, body_science, money_power)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - mind_hacks
          - ai_future
          - body_science
          - money_power
      topic:
        description: "Optional topic inside your niche (leave empty for AI trend research)"
        required: false
        type: string
      languages:
        description: "Optional languages override, e.g. en or en,fr or en,fr,ar (default: channel.yaml)"
        required: false
        type: string
      visual_mode:
        description: "Scene visuals: stock = moving B-roll video only ($0), auto = stock video + AI art where no clip fits, ai = AI art first, generated = gradients"
        required: false
        default: "stock"
        type: choice
        options:
          - stock
          - auto
          - ai
          - generated
      llm:
        description: "Text model: gemini (GEMINI_API_KEY) or claude (Claude Code CLI with CLAUDE_CODE_OAUTH_TOKEN); default = repo variable MODERATOR_LLM, else gemini"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - gemini
          - claude
      auto_upload:
        description: "Publishing: default = repo variable MODERATOR_AUTO_UPLOAD, else public (no approval). review_first = open an issue and wait for /approve"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - public
          - unlisted
          - private
          - review_first
      budget_usd:
        description: "Safety spend cap only (Free Tier keys always pay $0.00)"
        required: false
        default: "1.00"
        type: string

permissions:
  contents: write   # save topic history to the topics-history branch and update GitHub Pages
  issues: write     # open the Checkpoint C review issue

concurrency:
  group: generate-short
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Choose text model and verify its secret
        id: llm
        env:
          INPUT_LLM: ${{ (inputs.llm != 'default' && inputs.llm) || vars.MODERATOR_LLM || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          case "$INPUT_LLM" in
            gemini)
              if [ -z "$GEMINI_API_KEY" ]; then
                echo "::error::Missing GEMINI_API_KEY repository secret. Add it in GitHub -> Settings -> Secrets and variables -> Actions."
                exit 1
              fi ;;
            claude)
              if [ -z "$CLAUDE_CODE_OAUTH_TOKEN$ANTHROPIC_API_KEY" ]; then
                echo "::error::Missing CLAUDE_CODE_OAUTH_TOKEN secret (run 'claude setup-token' locally) or ANTHROPIC_API_KEY."
                exit 1
              fi
              [ -n "$GEMINI_API_KEY" ] || echo "::notice::No GEMINI_API_KEY: visuals use stock footage only (Claude cannot generate images)." ;;
            *)
              echo "::error::Unknown llm '$INPUT_LLM' (use gemini or claude)"; exit 1 ;;
          esac
          echo "provider=$INPUT_LLM" >> "$GITHUB_OUTPUT"

      - name: Choose publishing mode
        id: mode
        env:
          INPUT_UPLOAD: ${{ (inputs.auto_upload != 'default' && inputs.auto_upload) || vars.MODERATOR_AUTO_UPLOAD || 'public' }}
        run: |
          case "$INPUT_UPLOAD" in
            public|unlisted|private|review_first) ;;
            *) echo "::error::Unknown auto_upload '$INPUT_UPLOAD' (public, unlisted, private or review_first)"; exit 1 ;;
          esac
          echo "privacy=$INPUT_UPLOAD" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing mode: $INPUT_UPLOAD"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"

      - name: Install ffmpeg & libass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libass9

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Load topic history (so scheduled runs never repeat a topic)
        run: bash .github/scripts/topics-history.sh load

      - name: Install Claude Code CLI (pinned)
        if: steps.llm.outputs.provider == 'claude'
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.292 && claude --version

      - name: Generate Short(s) and pause at Checkpoint C (streaming progress to GitHub Pages)
        id: gen
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_LLM: ${{ steps.llm.outputs.provider }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INPUT_FORMAT: ${{ inputs.format || 'short' }}
          INPUT_PILLAR: ${{ inputs.pillar }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_LANGS: ${{ inputs.languages || vars.MODERATOR_LANGUAGES }}
          INPUT_NICHE: ${{ vars.MODERATOR_NICHE }}
          INPUT_VISUAL_MODE: ${{ inputs.visual_mode || vars.MODERATOR_VISUAL_MODE || 'stock' }}
          INPUT_BUDGET: ${{ inputs.budget_usd || vars.MODERATOR_BUDGET_USD || '1.00' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONIOENCODING: utf-8
        run: |
          WORKFLOW_NAME="youtube_short"
          if [ "$INPUT_FORMAT" = "long" ]; then
            WORKFLOW_NAME="youtube_long"
          fi
          args=(-p 'auto_approve=[A, B]' --llm "$INPUT_LLM")
          if [ -n "$INPUT_PILLAR" ] && [ "$INPUT_PILLAR" != "auto" ]; then args+=(-p "pillar=$INPUT_PILLAR"); fi
          if [ -n "$INPUT_TOPIC" ]; then args+=(-p "topic=$INPUT_TOPIC"); fi
          if [ -n "$INPUT_LANGS" ]; then args+=(-p "languages=$INPUT_LANGS"); fi
          if [ -n "$INPUT_NICHE" ]; then args+=(-p "niche=$INPUT_NICHE"); fi
          if [ -n "$INPUT_VISUAL_MODE" ] && [ "$INPUT_VISUAL_MODE" != "auto" ]; then
            args+=(-p "visual_mode=$INPUT_VISUAL_MODE")
          fi
          if [ -n "$INPUT_BUDGET" ]; then args+=(-p "budget_usd=$INPUT_BUDGET"); fi

          # Stream live state.json agent progress to GitHub Pages every 15s during execution
          (
            last_sig=""
            while true; do
              sig=$(sha256sum runs/*/state.json 2>/dev/null || true)
              if [ -n "$sig" ] && [ "$sig" != "$last_sig" ]; then
                last_sig="$sig"
                bash .github/scripts/push-gh-pages.sh --no-media --gh-run-url "$RUN_URL" || true
              fi
              sleep 15
            done
          ) &
          WATCHER_PID=$!
          trap "kill $WATCHER_PID 2>/dev/null || true" EXIT

          uv run python -m moderator run "$WORKFLOW_NAME" --headless "${args[@]}"

      - name: Upload run artifact (MP4s, thumbnails, captions, QA report, state.json)
        if: always() && steps.gen.outputs.run_dir
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: short-${{ steps.gen.outputs.run_id }}
          path: |
            ${{ steps.gen.outputs.run_dir }}
            !${{ steps.gen.outputs.run_dir }}/assets/raw
          retention-days: 14

      - name: Save topic history (topics-history branch; main only accepts pull requests)
        if: always()
        run: bash .github/scripts/topics-history.sh save

      - name: Upload to YouTube automatically (no approval)
        id: autoup
        if: steps.gen.outputs.outcome == 'waiting' && steps.mode.outputs.privacy != 'review_first'
        continue-on-error: true   # on failure the run falls back to a review issue so nothing is lost
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
          YOUTUBE_TOKEN_FR: ${{ secrets.YOUTUBE_TOKEN_FR }}
          YOUTUBE_TOKEN_AR: ${{ secrets.YOUTUBE_TOKEN_AR }}
          RUN_DIR: ${{ steps.gen.outputs.run_dir }}
          PRIVACY: ${{ steps.mode.outputs.privacy }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          uv run python -m moderator upload "$RUN_DIR" --approved-by "auto-publish" --privacy "$PRIVACY" > upload_result.txt 2> upload_err.txt
          rc=$?
          set -e
          cat upload_result.txt
          if [ "$rc" -ne 0 ]; then
            cat upload_err.txt >&2
            exit "$rc"
          fi
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Post to TikTok (only if TikTok secrets are configured)
        if: steps.autoup.outputs.uploaded == 'true'
        continue-on-error: true   # a TikTok problem must never affect the YouTube upload
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
          TIKTOK_TOKEN_EN: ${{ secrets.TIKTOK_TOKEN_EN }}
          TIKTOK_TOKEN_FR: ${{ secrets.TIKTOK_TOKEN_FR }}
          TIKTOK_TOKEN_AR: ${{ secrets.TIKTOK_TOKEN_AR }}
          RUN_DIR: ${{ steps.gen.outputs.run_dir }}
          PRIVACY: ${{ steps.mode.outputs.privacy }}
          PYTHONIOENCODING: utf-8
        run: |
          if [ -z "$TIKTOK_TOKEN$TIKTOK_TOKEN_EN$TIKTOK_TOKEN_FR$TIKTOK_TOKEN_AR" ]; then
            echo "::notice::No TikTok token secret configured; skipping TikTok."
            exit 0
          fi
          uv run python -m moderator upload-tiktok "$RUN_DIR" --privacy "$PRIVACY" | tee tiktok.txt
          { echo "### Posted to TikTok"; echo ""; sed 's/^/- /' tiktok.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Step Summary, Review Issue & GitHub Pages Dashboard
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_DIR: ${{ steps.gen.outputs.run_dir }}
          RUN_ID: ${{ steps.gen.outputs.run_id }}
          OUTCOME: ${{ steps.gen.outputs.outcome }}
          AUTO_UPLOADED: ${{ steps.autoup.outputs.uploaded }}
          AUTO_OUTCOME: ${{ steps.autoup.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PYTHONIOENCODING: utf-8
        run: |
          TARGET_DIR="$RUN_DIR"
          if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
            # Find the latest run folder if run_dir output was not captured
            LATEST_RUN=$(ls -td runs/*/ 2>/dev/null | head -1 || true)
            if [ -n "$LATEST_RUN" ] && [ -f "${LATEST_RUN}state.json" ]; then
              TARGET_DIR="${LATEST_RUN%/}"
            fi
          fi

          if [ -n "$TARGET_DIR" ] && [ -f "$TARGET_DIR/state.json" ]; then
            CURR_RUN_ID=$(python3 -c "import json; print(json.load(open('$TARGET_DIR/state.json'))['run_id'])")
            uv run python -m moderator summary "$TARGET_DIR" > body.md
            if [ "$AUTO_UPLOADED" = "true" ]; then
              # published automatically: record it on the dashboard, no review issue needed
              {
                echo ""
                echo "### Published automatically to YouTube"
                sed 's/^/- /' upload_result.txt
              } >> body.md
              cat body.md >> "$GITHUB_STEP_SUMMARY"
              bash .github/scripts/push-gh-pages.sh --run-id "$CURR_RUN_ID" --gh-run-url "$RUN_URL" || true
              exit 0
            elif [ "$OUTCOME" = "waiting" ]; then
              label=short-review
              title="Review Short: $CURR_RUN_ID"
              {
                echo ""
                echo "---"
                echo "### Live Agent Dashboard & Video Preview"
                echo "- **GitHub Pages Dashboard:** $PAGES_URL"
                echo "- **Action Artifact:** \`short-$CURR_RUN_ID\` at $RUN_URL"
                echo ""
                if [ "$AUTO_OUTCOME" = "failure" ]; then
                  echo "> [!WARNING]"
                  echo "> The automatic upload failed (see the run logs, often the YouTube daily quota or upload limit). The Short is saved: comment \`/approve public\` below to retry."
                  echo ""
                fi
                echo "### Publish Commands (Checkpoint C Approval)"
                echo "- \`/approve\` — upload all generated languages as **private**"
                echo "- \`/approve unlisted\` — upload as **unlisted**"
                echo "- \`/approve public\` — upload as **public**"
                echo "- \`/approve public en\` — upload only specific language(s)"
                echo "- \`/reject\` — close without uploading"
                echo ""
                echo "### Edit Before Publishing"
                echo "- \`/edit text make the hook punchier\` — rewrite the script"
                echo "- \`/edit first image show a man running at sunrise\` — replace scene visuals"
                echo "- \`/edit title ...\` / \`/edit thumbnail ...\` — title, description, thumbnail"
                echo "- \`/edit voice slower\` / \`/edit music lower\` — voiceover, mix"
              } >> body.md
            else
              label=short-failed
              title="Short generation failed: $CURR_RUN_ID"
              printf '\n\nDashboard: %s\nLogs: %s\n' "$PAGES_URL" "$RUN_URL" >> body.md
            fi
          else
            label=short-failed
            CURR_RUN_ID="gh-${{ github.run_id }}"
            title="Short generation pipeline failed: $CURR_RUN_ID"
            {
              echo "## ❌ Pipeline Startup Failure"
              echo ""
              echo "> [!CAUTION]"
              echo "> **The workflow terminated before the agent run could initialize or save state.**"
              echo "> Common causes: API rate limits/quota on initial probe, missing environment credentials, or dependency install issues."
              echo ""
              echo "- **Action Run Logs:** $RUN_URL"
              echo "- **Workflow:** \`Generate Short\`"
              echo "- **Commit:** \`${{ github.sha }}\`"
            } > body.md
          fi

          cat body.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n<!-- run_id: %s -->\n<!-- gh_run_id: %s -->\n' "$CURR_RUN_ID" "${{ github.run_id }}" >> body.md
          gh label create "$label" --force >/dev/null
          ISSUE_URL=$(gh issue create --title "$title" --label "$label" --body-file body.md)
          echo "Issue created: $ISSUE_URL"
          if [ -n "$TARGET_DIR" ] && [ -f "$TARGET_DIR/state.json" ]; then
            bash .github/scripts/push-gh-pages.sh --run-id "$CURR_RUN_ID" --issue-url "$ISSUE_URL" --gh-run-url "$RUN_URL" || true
          fi
