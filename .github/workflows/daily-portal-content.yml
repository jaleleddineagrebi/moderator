name: Daily Psychology & AI Content Pipeline

on:
  schedule:
    # Runs twice daily: 08:00 UTC (Morning Focus) and 18:00 UTC (Evening Insight)
    - cron: '0 8,18 * * *'
  workflow_dispatch:
    inputs:
      force_rerun:
        description: 'Force immediate crawling and publishing'
        required: false
        default: 'true'

concurrency:
  group: daily-portal-content
  cancel-in-progress: false

permissions:
  contents: write        # push the daily-posts branch and the portal-history archive
  pull-requests: write # open the pull request with the new posts
  actions: write       # start CI on that branch (PRs opened by Actions do not trigger CI by themselves)

jobs:
  crawl-synthesize-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r portal/automation/requirements.txt

      - name: Load Past Daily Posts History
        run: bash .github/scripts/portal-history.sh load

      - name: Run Twice-Daily Content Automation Pipeline
        id: pipeline
        env:
          PORTAL_API_ENDPOINT: ${{ secrets.PORTAL_API_ENDPOINT }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET || 'portal-covers' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # real Shorts of the channel, so each article links to a playable video
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UCzjz2ArvjE4RgR_2k2o53mg' }}
        run: |
          python -m portal.automation.pipeline

      - name: Save Daily Posts History (portal-history branch; main only accepts pull requests)
        if: always()
        run: bash .github/scripts/portal-history.sh save

      - name: Open a pull request with the new posts
        if: always() && steps.pipeline.outputs.posts_file
        env:
          GH_TOKEN: ${{ github.token }}
          POSTS_FILE: ${{ steps.pipeline.outputs.posts_file }}
          POSTS_TITLES: ${{ steps.pipeline.outputs.posts_titles }}
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          stamp=$(date -u +%Y-%m-%d_%H%M)
          branch="daily-posts/${stamp}-${{ github.run_id }}"
          git config user.name "moderator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -c "$branch"
          git add -- "$POSTS_FILE"
          git commit -q -m "Add daily Psychology & AI posts ($stamp)"
          git push -q origin "$branch"

          {
            echo "New daily posts generated by [this run]($RUN_URL)."
            echo ""
            echo "File: \`$POSTS_FILE\`"
            echo ""
            echo "Posts (titles written by the AI):"
            echo ""
            echo '```'
            echo "$POSTS_TITLES" | tr -d '`@'
            echo '```'
            echo ""
            if [ "$PIPELINE_OUTCOME" = "success" ]; then
              echo "The posts were saved to the portal database by the pipeline. Merging this PR only archives them in the repository."
            else
              echo "**The pipeline reported a problem saving to the portal database** (see the run logs). Merging only archives the posts."
            fi
          } > pr_body.md

          if gh pr create --base main --head "$branch" --title "Daily posts $stamp" --body-file pr_body.md; then
            # A PR opened with the workflow token does not start CI, and the main ruleset requires the `test` check
            gh workflow run ci.yml --ref "$branch" || echo "::warning::Could not start CI on $branch; run the CI workflow on it manually."
          else
            echo "::warning::Could not open the pull request. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open it yourself: ${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
          fi
