name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "history/**"
      - "**.md"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run test suite
        run: uv run pytest -v

