name: CI & Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "history/**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Run test suite
        run: uv run pytest -v
      - name: Sync Moderator Dashboard to GitHub Pages (gh-pages)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/push-gh-pages.sh --no-media
